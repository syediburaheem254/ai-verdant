<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Verdant — Optimal Strategy</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#06090a">
<link rel="apple-touch-icon" href="assets/icon-192.png">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="aiv-sidebar"></aside>
  <main class="main">
    <div class="page-header">
      <div class="eyebrow">Prioritized action plan</div>
      <div class="page-title">Optimal Strategy</div>
      <p class="page-desc">One consolidated plan, built from every sensor reading, ranked by urgency so you know exactly what to do and when.</p>
    </div>
    <div id="aiv-content"><div class="card">Building your strategy…</div></div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
async function main() {
  await AIV.renderShell();
  const deviceId = AIV.getDeviceId();
  const content = document.getElementById("aiv-content");

  try {
    const [strategy, recs] = await Promise.all([
      AIV.api.strategy(deviceId),
      AIV.api.recommendations(deviceId),
    ]);

    const timelineHtml = strategy.timeline.map((block) => `
      <div class="timeline-block">
        <div class="timeline-window">${block.window}</div>
        <div class="timeline-items">
          ${block.items.map((item) => `<div class="timeline-item">${item}</div>`).join("")}
        </div>
      </div>
    `).join("");

    const recHtml = recs.map((r) => `
      <div class="rec-row">
        <div class="rec-body">
          <div class="rec-msg">${AIV.severityBadge(r.severity)} &nbsp;${r.message}</div>
          <div class="rec-strategy">${r.strategy}</div>
        </div>
      </div>`).join("");

    content.innerHTML = `
      <div class="card glow-green" style="margin-bottom:20px;">
        <div class="score-hero">
          <div class="score-ring" id="aiv-score-ring"></div>
          <div>
            <h3 style="font-size:19px; margin-bottom:8px;">${strategy.headline}</h3>
            <p style="color:var(--muted); font-size:14px; line-height:1.6;">This plan is generated fresh from your most recent sensor reading and updates automatically every time the device syncs.</p>
          </div>
        </div>
      </div>

      <div class="grid grid-2" style="align-items:start;">
        <div class="card">
          <div class="metric-label" style="margin-bottom:16px;">Action timeline</div>
          <div class="timeline">${timelineHtml}</div>
        </div>
        <div class="card">
          <div class="metric-label" style="margin-bottom:6px;">All recommendations</div>
          ${recHtml || AIV.emptyState("Nothing to flag right now.")}
        </div>
      </div>
    `;
    AIV.renderScoreRing("aiv-score-ring", strategy.overall_score);
  } catch (e) {
    content.innerHTML = AIV.emptyState(`Couldn't build a strategy (${e.message}). Make sure the device has sent at least one reading.`);
  }
}
main();
</script>
</body>
</html>

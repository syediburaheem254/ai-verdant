<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Verdant — Trends & History</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#06090a">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="aiv-sidebar"></aside>
  <main class="main">
    <div class="page-header">
      <div class="eyebrow">Fluctuations over time</div>
      <div class="page-title">Trends &amp; History</div>
      <p class="page-desc">How your field's conditions have moved over the last day — and what the shape of each line actually means.</p>
    </div>

    <div style="margin-bottom:18px;">
      <select id="aiv-range" style="background:var(--bg-panel); color:var(--text); border:1px solid var(--line); border-radius:99px; padding:9px 16px; font-family:var(--font-body);">
        <option value="6">Last 6 hours</option>
        <option value="24" selected>Last 24 hours</option>
        <option value="72">Last 3 days</option>
        <option value="168">Last 7 days</option>
      </select>
    </div>

    <div id="aiv-content"><div class="card">Loading history…</div></div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
const CHART_DEFS = [
  { key: "temperature_c", label: "Temperature (°C)" },
  { key: "humidity_pct", label: "Humidity (%)" },
  { key: "soil_moisture_pct", label: "Soil Moisture (%)" },
  { key: "ph", label: "Soil pH" },
];

function describeTrend(label, values) {
  const clean = values.filter((v) => v !== null && v !== undefined);
  if (clean.length < 2) return `Not enough ${label.toLowerCase()} readings yet to describe a trend.`;
  const first = clean[0], last = clean[clean.length - 1];
  const min = Math.min(...clean), max = Math.max(...clean);
  const delta = (last - first).toFixed(1);
  const direction = last > first ? "risen" : last < first ? "fallen" : "stayed flat";
  return `${label} has ${direction} by ${Math.abs(delta)} over this window (range ${min}–${max}), currently at ${last}.`;
}

async function drawChart(canvasId, labels, values, color, label) {
  new Chart(document.getElementById(canvasId), {
    type: "line",
    data: {
      labels,
      datasets: [{
        label, data: values, borderColor: color, backgroundColor: color + "22",
        fill: true, tension: 0.35, pointRadius: 0, borderWidth: 2,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#7fa691", maxTicksLimit: 6 }, grid: { color: "#16261f" } },
        y: { ticks: { color: "#7fa691" }, grid: { color: "#16261f" } },
      },
    },
  });
}

async function load(hours) {
  const deviceId = AIV.getDeviceId();
  const content = document.getElementById("aiv-content");
  content.innerHTML = `<div class="card">Loading history…</div>`;
  try {
    const rows = await AIV.api.history(deviceId, hours);
    if (!rows.length) {
      content.innerHTML = AIV.emptyState("No readings in this window yet. Once the sensor box syncs a few times, trend lines will appear here.");
      return;
    }
    const labels = rows.map((r) => AIV.formatTime(r.timestamp));

    content.innerHTML = `<div class="grid grid-2">${CHART_DEFS.map((c) => `
      <div class="card">
        <div class="metric-label" style="margin-bottom:12px;">${AIV.SENSOR_META[c.key].icon} ${c.label}</div>
        <div class="chart-wrap"><canvas id="chart-${c.key}"></canvas></div>
        <p style="font-size:13px; color:var(--muted); margin-top:12px; line-height:1.5;" id="desc-${c.key}"></p>
      </div>`).join("")}</div>`;

    CHART_DEFS.forEach((c) => {
      const values = rows.map((r) => r[c.key]);
      drawChart(`chart-${c.key}`, labels, values, AIV.SENSOR_META[c.key].color, c.label);
      document.getElementById(`desc-${c.key}`).textContent = describeTrend(c.label, values);
    });
  } catch (e) {
    content.innerHTML = AIV.emptyState(`Couldn't load history (${e.message}).`);
  }
}

async function main() {
  await AIV.renderShell();
  document.getElementById("aiv-range").addEventListener("change", (e) => load(e.target.value));
  load(24);
}
main();
</script>
</body>
</html>
